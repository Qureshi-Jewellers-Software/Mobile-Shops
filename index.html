<title>Mobile Shop & Qistain</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:16px}
header{background:#2f6db5;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px}
header small{opacity:.85}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0001}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#64748b;padding:4px 0;cursor:pointer}
nav.bottom button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:#2f6db5;font-weight:600}
nav.bottom .plus{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:#2f6db5;color:#fff;margin:-26px 6px 0;box-shadow:0 4px 12px #2f6db566;justify-content:center;padding:0}
nav.bottom .plus svg{width:30px;height:30px;stroke-width:2.4}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 12px}
.tile{border:0;border-radius:14px;background:#eaf2fc;color:#1e3a5f;padding:16px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.tile span{font-size:28px}
main{padding:12px 12px 96px;max-width:760px;margin:auto}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sg{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column}
.sg span{font-size:13px;color:#64748b}.sg:active{background:#eaf2fc}.sg.new{border-style:dashed;border-color:#2f6db5;background:#f5f9fe}
.chip{display:flex;align-items:center;gap:8px;background:#eaf2fc;border-radius:10px;padding:10px 12px;margin-top:6px;flex-wrap:wrap}
.chip button{margin-left:auto;border:0;background:#fff;border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer}
.steps{background:#eaf2fc;border-radius:10px;padding:8px 10px;font-size:13px;color:#1e3a5f;line-height:2}
.steps span{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#2f6db5;color:#fff;font-size:12px}
.empty{border:2px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;color:#64748b;margin-top:12px}
.cartrow{border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin-bottom:8px}
.cn{display:flex;align-items:center;gap:6px}.cn .x{margin-left:auto;border:0;background:#fee2e2;color:#b91c1c;border-radius:50%;width:28px;height:28px;cursor:pointer}
.cq{display:flex;align-items:center;gap:8px;margin-top:8px}.cq button{width:36px;height:36px;border-radius:50%;border:0;background:#eaf2fc;color:#2f6db5;font-size:20px;cursor:pointer}
.cq b{min-width:22px;text-align:center}.cq input{flex:1}
.totbar{display:flex;justify-content:space-between;align-items:center;background:#2f6db5;color:#fff;border-radius:12px;padding:12px 14px;margin-top:12px}.totbar b{font-size:22px}
.btn.big{padding:14px;font-size:17px;margin-top:10px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:12px 0 6px;color:#334155}
label{display:block;font-size:13px;color:#475569;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 14px;font-size:15px;background:#2f6db5;color:#fff;margin:4px 4px 0 0;cursor:pointer}
.btn.sec{background:#e2e8f0;color:#0f172a}.btn.red{background:#dc2626}.btn.wa{background:#16a34a}.btn.sm{padding:6px 10px;font-size:13px}
.full{width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f8fafc;border-radius:10px;padding:10px}
.stat span{display:block;font-size:12px;color:#64748b}.stat b{font-size:18px}
.statbtn{background:#2f6db5;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px #0001}.statbtn:active{background:#265b98}.statbtn span{color:#dbe7f7!important}.statbtn b{color:#fff!important;font-size:22px}.statbtn i{display:block;font-style:normal;font-size:12px;color:#dbe7f7;margin-top:2px}.stats .statbtn{padding:14px 12px}.statbtn.light{background:#eaf2fc;border:1px solid #bcd2ef}.statbtn.light:active{background:#d6e5f8}.statbtn.light span{color:#1e3a5f!important;font-weight:600}.statbtn.light b{color:#2f6db5!important;font-size:19px}.statbtn.light i{color:#2f6db5}.statbtn small.sub{display:block;font-size:12px;color:#1e3a5f;margin-top:2px;line-height:1.4}
.item{border-top:1px solid #e2e8f0;padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item:first-child{border-top:0}
.muted{color:#64748b;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#e2e8f0}
.tag.late{background:#fee2e2;color:#b91c1c}.tag.due{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid #e2e8f0;text-align:left}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
#receipt{font-family:monospace;font-size:14px;border:1px dashed #94a3b8;padding:12px;border-radius:8px;white-space:pre-wrap}
.login{max-width:380px;margin:60px auto}
.scanrow{display:flex;gap:6px;align-items:center}.scanrow input,.scanrow select{flex:1}.scanrow .btn{margin:0;flex:0 0 auto}
#scanbox video,#scanbox>div{width:100%;border-radius:10px;background:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:30}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;border:0;width:80mm}}

<script>
// ---------- Data ----------
const KEY='mobileShopDB_v1';
let db=load();if(db&&!db.models)db.models={};
if(db&&!db.dealers){db.dealers=[];db.dealerTx=[]}
if(db&&!db.staff){db.staff=db.settings.staffPin?[{id:uid(),name:'Staff',phone:'',pin:db.settings.staffPin,active:true}]:[];delete db.settings.staffPin;save()}
let role=null, staffId=null, tab='home';try{const r=localStorage.getItem('mobileShopRole');staffId=localStorage.getItem('mobileShopStaff');if(r==='owner')role=r;else if(r==='staff'&&db&&db.staff.some(x=>x.id===staffId&&x.active))role=r}catch(e){}
function setRole(r,sid){role=r;staffId=sid||null;try{r?localStorage.setItem('mobileShopRole',r):localStorage.removeItem('mobileShopRole');sid?localStorage.setItem('mobileShopStaff',sid):localStorage.removeItem('mobileShopStaff')}catch(e){}}
function whoName(){if(role==='owner')return'Malik';const st=db.staff.find(x=>x.id===staffId);return st?st.name:'Staff'}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Save nahi hua: '+e.message)}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return ymd(new Date())}
function rs(n){return 'Rs '+Math.round(+n||0).toLocaleString('en-PK')}
function fmtD(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'-'+m+'-'+y}
function addMonths(s,k){const d=pd(s);const day=d.getDate();d.setMonth(d.getMonth()+k);if(d.getDate()!==day)d.setDate(0);return ymd(d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(id){return document.getElementById(id)}
function val(id){return ($(id)?.value||'').trim()}
function num(id){return parseFloat(val(id))||0}
function toast(t){const e=$('toast');e.textContent=tr(t);e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const isOwner=()=>role==='owner';
function cust(id){return db.customers.find(c=>c.id===id)}

// ---------- Plan helpers ----------
function makeSchedule(amount,months,start){
  const per=Math.ceil(amount/months/10)*10; const s=[]; let left=amount;
  for(let i=0;i<months;i++){const a=i===months-1?left:Math.min(per,left);s.push({no:i+1,due:addMonths(start,i),amount:a,paid:0});left-=a}
  return s.filter(x=>x.amount>0);
}
function applyPayment(p,amt){let left=amt;for(const s of p.schedule){if(left<=0)break;const need=s.amount-s.paid;if(need>0){const t=Math.min(need,left);s.paid+=t;left-=t}}return left}
function remaining(p){return p.schedule.reduce((a,s)=>a+(s.amount-s.paid),0)}
function paidTotal(p){return p.advance+p.payments.reduce((a,x)=>a+x.amount,0)+(p.openingPaid||0)}
function status(p){
  const t=today();const rem=remaining(p);
  if(rem<=0)return{c:'ok',t:'Mukammal'};
  const late=p.schedule.filter(s=>s.paid<s.amount&&s.due<t);
  if(late.length)return{c:'late',t:late.length+' qist late',lateAmt:late.reduce((a,s)=>a+s.amount-s.paid,0),days:Math.floor((new Date(t)-new Date(late[0].due))/864e5)};
  const nx=p.schedule.find(s=>s.paid<s.amount);
  if(nx&&nx.due===t)return{c:'due',t:'Aaj due'};
  return{c:'',t:'Agli: '+fmtD(nx?.due)};
}
function nextDue(p){return p.schedule.find(s=>s.paid<s.amount)}

function trDom(root){if(lang!=='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(trDone.get(n)===n.nodeValue)continue;if(n.parentElement&&n.parentElement.id==='receipt')continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;trDone.set(n,n.nodeValue)}
 root.querySelectorAll('[placeholder]').forEach(e=>{if(e.dataset.tr)return;e.placeholder=tr(e.placeholder);e.dataset.tr=1})}
let trBusy=false;new MutationObserver(()=>{if(trBusy)return;trBusy=true;trDom($('app'));trDom($('sheet'));trBusy=false}).observe(document.body,{childList:true,subtree:true});

// ---------- Setup / Login ----------
function render(){
  if(!db){return renderSetup()}
  if(!role){return renderLogin()}

  $('app').innerHTML=`<header><div><b>${esc(db.settings.shop)}</b><br><small>${isOwner()?'Malik login':esc(whoName())+' (Staff)'}</small></div><div>${langBtn()} <button class="btn sec sm" onclick="logout()">Logout</button></div></header>
  <main id="main"></main>${bottomNav()}`;
  (views[tab]||views.home)();
}
function go(t){tab=t;render();scrollTo(0,0)}
function logout(){setRole(null);render()}
function renderSetup(){
  $('app').innerHTML=`<div class="login card"><div style="text-align:right">${langBtn()}</div><h2>Pehli dafa setup</h2>
  <label>Dukaan ka naam</label><input id="s_shop" placeholder="Jaise: Ali Mobile Zone">
  <label>Phone number</label><input id="s_phone" inputmode="tel">
  <label>Pata (address)</label><input id="s_addr">
  <label>Malik PIN (sirf aap)</label><input id="s_op" type="password" inputmode="numeric">
  <label>Staff PIN</label><input id="s_sp" type="password" inputmode="numeric">
  <button class="btn full" onclick="doSetup()">Shuru karein</button></div>`;
}
function doSetup(){
  if(!val('s_shop')||!val('s_op')||!val('s_sp'))return alert('Naam, Malik PIN aur Staff PIN zaroori hain');
  if(val('s_op')===val('s_sp'))return alert('Malik aur Staff ka PIN alag rakhein');
  db={settings:{shop:val('s_shop'),phone:val('s_phone'),address:val('s_addr'),ownerPin:val('s_op'),defaultPercent:20,defaultFine:0},staff:[{id:uid(),name:'Staff',phone:'',pin:val('s_sp'),active:true}],dealers:[],dealerTx:[],
      accessories:[],mobiles:[],models:{},customers:[],plans:[],sales:[]};
  save();setRole('owner');render();
}
function renderLogin(){
  $('app').innerHTML=`<div class="login card"><div style="text-align:right">${langBtn()}</div><h2>${esc(db.settings.shop)}</h2>
  <label>PIN likhein</label><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn full" onclick="doLogin()">Login</button></div>`;
  setTimeout(()=>$('pin')?.focus(),50);
}
function doLogin(){const p=val('pin');if(p===db.settings.ownerPin)setRole('owner');else{const st=db.staff.find(x=>x.active&&x.pin===p);if(st)setRole('staff',st.id);else return alert('PIN ghalat hai')}tab='home';render()}

// ---------- Views ----------
const views={};
function planRow(p){const c=cust(p.customerId),st=status(p),nx=nextDue(p);return`<div class="item"><div onclick="custDetail('${c.id}')" style="cursor:pointer;flex:1"><b>${esc(c?.name)}</b> <span class="tag ${st.c}">${st.t}</span><br><span class="muted">${esc(p.item)} · ${esc(c?.phone)}${st.lateAmt?' · baqi '+rs(st.lateAmt)+(st.days?' · '+st.days+' din':''):' · qist '+rs(nx?.amount-nx?.paid)}</span><br><span class="muted" style="color:#2f6db5">Poori history ›</span></div><div><button class="btn wa sm" onclick="remind('${p.id}')">WhatsApp</button><button class="btn sm" onclick="openPay('${p.id}')">Wasool</button></div></div>`}
function homeData(){const t=today();const active=db.plans.filter(p=>remaining(p)>0);
 return{t,late:active.filter(p=>status(p).c==='late').sort((a,b)=>status(b).days-status(a).days),due:active.filter(p=>status(p).c==='due'),
  pays:db.plans.flatMap(p=>p.payments.filter(x=>x.date===t).map(x=>({p,x}))),sales:db.sales.filter(s=>s.date===t),
  week:active.filter(p=>{const st=status(p);if(st.c)return false;const nx=nextDue(p);const w=pd(t);w.setDate(w.getDate()+7);return nx&&nx.due>t&&nx.due<=ymd(w)}).sort((a,b)=>nextDue(a).due.localeCompare(nextDue(b).due)),
  low:db.accessories.filter(a=>a.qty<=3).sort((a,b)=>a.qty-b.qty),
  monthPays:db.plans.flatMap(p=>p.payments.filter(x=>x.date.startsWith(t.slice(0,7))).map(x=>({p,x}))).sort((a,b)=>b.x.date.localeCompare(a.x.date)),
  get monthColl(){return this.monthPays.reduce((a,o)=>a+o.x.amount+(o.x.fine||0),0)},
  out:active.reduce((a,p)=>a+remaining(p),0),active}}
views.home=()=>{
  const h=homeData();
  const coll=h.pays.reduce((a,o)=>a+o.x.amount+(o.x.fine||0),0),sale=h.sales.reduce((a,s)=>a+s.total,0);
  const box=(k,label,v,col)=>`<button class="stat statbtn" onclick="homeOpen('${k}')"><span>${label}</span><b${col?` style="color:${col}"`:''}>${v}</b><i>Dekhein ›</i></button>`;
  $('main').innerHTML=`<div class="card"><div class="stats">
   ${box('coll','Aaj ki wasooli',rs(coll))}${box('sale','Aaj ki cash sale',rs(sale))}${box('due','Aaj due',h.due.length)}${box('late','Late customers',h.late.length)}</div></div>
   <div class="card"><div class="stats">
   ${box2('week','📅 Agle 7 din',h.week.length+' qist')}${box2('low','📦 Stock kam',h.low.length+(h.low.length===1?' cheez':' cheezein'))}
   ${isOwner()?box2('month','💰 Is mahine ki wasooli',rs(h.monthColl))+box2('out','🏦 Logon ne dena hai',rs(h.out),'Asal: '+rs(principalTotal())+'<br>Munafa: '+rs(h.out-principalTotal()))+box2('maal','🏪 Dukaan ka maal',rs(stockValue().cost))+box2('dealer','🚚 Dealers ko dena',rs(dealerTotal())):''}</div></div>`;
};
function box2(k,label,v,sub){return`<button class="stat statbtn light" onclick="homeOpen('${k}')"><span>${label}</span><b>${v}</b>${sub?`<small class="sub">${sub}</small>`:''}<i>Dekhein ›</i></button>`}
function homeOpen(k){const h=homeData();let title='',body='';
 if(k==='due'){title='Aaj due qistain';body=h.due.map(planRow).join('')}
 if(k==='late'){title='Late customers';body=h.late.map(planRow).join('')}
 if(k==='coll'){title='Aaj ki wasooli';body=h.pays.map(({p,x})=>{const c=cust(p.customerId);return`<div class="item"><div onclick="custDetail('${c.id}')" style="cursor:pointer;flex:1"><b>${esc(c.name)}</b><br><span class="muted">${esc(p.item)} · ${esc(x.by)}${x.fine?' · jurmana '+rs(x.fine):''}</span><br><span class="muted" style="color:#2f6db5">Poori history ›</span></div><div><b>${rs(x.amount)}</b><br><button class="btn sec sm" onclick="showReceipt(payReceipt(db.plans.find(q=>q.id==='${p.id}'),db.plans.find(q=>q.id==='${p.id}').payments.find(y=>y.id==='${x.id}')),'${esc(c.phone)}')">Receipt</button></div></div>`}).join('');
  body+=h.pays.length?`<h3>Kul: ${rs(h.pays.reduce((a,o)=>a+o.x.amount+(o.x.fine||0),0))}</h3>`:''}
 if(k==='week'){title='Agle 7 din ki qistain';body=h.week.map(p=>{const c=cust(p.customerId),nx=nextDue(p);return`<div class="item"><div onclick="custDetail('${c.id}')" style="cursor:pointer;flex:1"><b>${esc(c.name)}</b> <span class="tag">${fmtD(nx.due)}</span><br><span class="muted">${esc(p.item)} · qist ${rs(nx.amount-nx.paid)}</span><br><span class="muted" style="color:#2f6db5">Poori history ›</span></div><div><button class="btn wa sm" onclick="remindAhead('${p.id}')">WhatsApp</button></div></div>`}).join('')}
 if(k==='low'){title='Stock kam';const mobs=db.mobiles.filter(m=>m.status==='stock');const byModel={};mobs.forEach(m=>byModel[m.model]=(byModel[m.model]||0)+1);
  body='<h3>Accessories (3 ya kam)</h3>'+(h.low.map(a=>`<div class="item"><b>${esc(a.name)}</b><span class="tag ${a.qty===0?'late':'due'}">${a.qty}</span></div>`).join('')||'<p class="muted">Sab theek hai</p>')+'<h3>Mobiles stock mein: '+mobs.length+'</h3>'+(Object.entries(byModel).map(([m,n])=>`<div class="item"><span>${esc(m)}</span><span class="tag ${n===1?'due':''}">${n}</span></div>`).join('')||'<p class="muted">Koi mobile nahi</p>')}
 if(k==='month'){title='Is mahine ki wasooli';let last='';body=h.monthPays.map(({p,x})=>{const c=cust(p.customerId);const hd=x.date!==last?`<h3>${fmtD(x.date)} — ${rs(h.monthPays.filter(o=>o.x.date===x.date).reduce((a,o)=>a+o.x.amount+(o.x.fine||0),0))}</h3>`:'';last=x.date;return hd+`<div class="item"><div onclick="custDetail('${c.id}')" style="cursor:pointer;flex:1"><b>${esc(c.name)}</b><br><span class="muted">${esc(p.item)} · ${esc(x.by)}</span></div><b>${rs(x.amount+(x.fine||0))}</b></div>`}).join('');body+=h.monthPays.length?`<h3>Kul: ${rs(h.monthColl)}</h3>`:''}
 if(k==='maal'){title='Dukaan ka maal';const v=stockValue();body=`<table><tr><th></th><th>Piece</th><th>Khareed</th><th>Bechne par</th></tr><tr><td><b>Accessories</b></td><td>${v.accQty}</td><td>${rs(v.accCost)}</td><td>${rs(v.accPrice)}</td></tr><tr><td><b>Mobiles</b></td><td>${v.mobQty}</td><td>${rs(v.mobCost)}</td><td>${rs(v.mobPrice)}</td></tr><tr><td><b>Kul</b></td><td>${v.accQty+v.mobQty}</td><td><b>${rs(v.cost)}</b></td><td><b>${rs(v.price)}</b></td></tr></table><p class="muted">Sab bik jaye to takreeban munafa: ${rs(v.price-v.cost)}</p>`}
 if(k==='dealer'){title='Dealers ko dena';body=db.dealers.map(d=>`<div class="item" onclick="closeM();go('dealers');setTimeout(()=>dealerDetail('${d.id}'),50)" style="cursor:pointer"><div><b>${esc(d.name)}</b><br><span class="muted">${esc(d.phone)}</span></div><b>${rs(dealerBal(d.id))}</b></div>`).join('')+`<h3>Kul: ${rs(dealerTotal())}</h3>`}
 if(k==='out'){title='Logon ne dena hai';const arr=h.active.slice().sort((a,b)=>remaining(b)-remaining(a));const pr=principalTotal();body=`<div class="stats"><div class="stat"><span>Kul lena hai (munafa samet)</span><b>${rs(h.out)}</b></div><div class="stat"><span>Asal raqam (principal)</span><b>${rs(pr)}</b></div><div class="stat"><span>Munafa jo aana hai</span><b style="color:#2f6db5">${rs(h.out-pr)}</b></div><div class="stat"><span>Accounts</span><b>${arr.length}</b></div></div><h3>Customers</h3>`+arr.map(p=>{const c=cust(p.customerId),st=status(p);return`<div class="item"><div onclick="custDetail('${c.id}')" style="cursor:pointer;flex:1"><b>${esc(c.name)}</b> <span class="tag ${st.c}">${st.t}</span><br><span class="muted">${esc(p.item)}</span></div><b>${rs(remaining(p))}</b></div>`}).join('')}
 if(k==='sale'){title='Aaj ki cash sale';body=h.sales.slice().reverse().map(s=>`<div class="item"><div>${s.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}<br><span class="muted">${esc(s.by)}${s.discount?' · discount '+rs(s.discount):''}</span></div><div><b>${rs(s.total)}</b><br><button class="btn sec sm" onclick="saleReceipt('${s.id}')">Receipt</button></div></div>`).join('');
  body+=h.sales.length?`<h3>Kul: ${rs(h.sales.reduce((a,s)=>a+s.total,0))}</h3>`:''}
 $('sheet').innerHTML=`<h2>${title}</h2>${body||'<p class="muted">Koi nahi</p>'}<button class="btn sec full" onclick="closeM()">Band karein</button>`;$('modal').classList.add('show')}

const PK={};
function pickerHtml(id,ph,scanBtn){return`<div class="scanrow"><input id="${id}_s" placeholder="${ph}" autocomplete="off" oninput="pkRun('${id}')" onfocus="pkRun('${id}')">${scanBtn||''}</div><div id="${id}_l" class="sugg"></div><div id="${id}_c"></div><input type="hidden" id="${id}">`}
function pkRun(id){const cfg=PK[id];const q=val(id+'_s').toLowerCase();const box=$(id+'_l');if(!box)return;
 let res=cfg.source(q).slice(0,8);let h=res.map((r,k)=>`<button class="sg" onclick="pkPick('${id}',${k})"><b>${esc(r.label)}</b><span>${esc(r.sub||'')}</span></button>`).join('');
 if(q&&cfg.onNew)h+=`<button class="sg new" onclick="PK['${id}'].onNew(val('${id}_s'))"><b>➕ "${esc(val(id+'_s'))}" haath se add karein</b><span>Stock mein nahi hai to naam aur qeemat khud likhein</span></button>`;
 if(q&&!res.length&&!cfg.onNew)h='<p class="muted">Kuch nahi mila</p>';
 cfg._res=res;box.innerHTML=h}
function pkPick(id,k){const r=PK[id]._res[k];PK[id].onPick(r);}
function pkChoose(id,r){$(id).value=r.id;$(id+'_s').value='';$(id+'_l').innerHTML='';$(id+'_c').innerHTML=`<div class="chip">✔ <b>${esc(r.label)}</b> <span class="muted">${esc(r.sub||'')}</span><button onclick="pkClear('${id}')">✕</button></div>`;$(id+'_s').parentElement.style.display='none';if(PK[id].afterChoose)PK[id].afterChoose(r)}

let cart=[];
views.sale=()=>{
  $('main').innerHTML=`<div class="card"><h2>🛒 Cash sale</h2>
   <div class="steps"><span>1</span> Cheez dhoondein &nbsp; <span>2</span> Tadaad / qeemat theek karein &nbsp; <span>3</span> Mukammal dabayein</div>
   <label>Kya bechna hai? Naam, model ya IMEI likhein</label>
   ${pickerHtml('cs','Jaise: charger, cover, Spark 20 ...',`<button class="btn sec" onclick="scan(v=>{const m=db.mobiles.find(x=>x.status==='stock'&&x.imei===v.replace(/\\D/g,''));if(m)saleAdd({m});else alert('Ye IMEI stock mein nahi mila: '+v)})">📷</button>`)}
   <div id="cartbox"></div></div>
   <div class="card"><h2>Aaj ki sales</h2>${db.sales.filter(s=>s.date===today()).reverse().map(s=>`<div class="item"><div>${s.items.map(i=>esc(i.name)).join(', ')}<br><span class="muted">${esc(s.by)}</span></div><div><b>${rs(s.total)}</b> <button class="btn sec sm" onclick="saleReceipt('${s.id}')">Receipt</button></div></div>`).join('')||'<p class="muted">Koi nahi</p>'}</div>`;
  PK.cs={source:q=>!q?[]:[...db.accessories.filter(a=>a.qty>0&&a.name.toLowerCase().includes(q)).map(a=>({label:a.name,sub:'Stock: '+a.qty+' · '+rs(a.price),a})),...mobSource(q)],
   onPick:saleAdd,onNew:t=>{cart.push({name:t,qty:1,price:0,cost:0,manual:true});$('cs_s').value='';$('cs_l').innerHTML='';renderCart(true)}};
  renderCart();
};
function saleAdd(r){
  if(r.a){const a=r.a;const ex=cart.find(c=>c.accId===a.id);if(ex){if(ex.qty+1>a.qty)return alert('Stock mein sirf '+a.qty+' hain');ex.qty++}else cart.push({accId:a.id,name:a.name,qty:1,price:a.price,cost:a.cost||0,max:a.qty})}
  if(r.m){const m=r.m;if(cart.some(c=>c.mobId===m.id))return toast('Pehle se bill mein hai');cart.push({mobId:m.id,name:m.model+' ('+m.imei+')',qty:1,price:m.price,cost:m.cost||0,max:1})}
  $('cs_s').value='';$('cs_l').innerHTML='';renderCart();
}
function cartQty(i,d){const c=cart[i];const n=c.qty+d;if(n<1)return;if(c.max&&n>c.max)return alert('Stock mein sirf '+c.max+' hain');c.qty=n;renderCart()}
function cartPrice(i,v){cart[i].price=parseFloat(v)||0;renderTotals()}
function renderTotals(){const sub=cart.reduce((a,c)=>a+c.price*c.qty,0),d=num('c_disc');const e=$('c_tot');if(e)e.textContent=rs(sub-d)}
function renderCart(focusLast){const b=$('cartbox');if(!b)return;
  if(!cart.length){b.innerHTML='<div class="empty">Bill abhi khali hai. Upar likh kar cheez chunein.</div>';return}
  const disc=$('c_disc')?.value||0,ph=$('c_ph')?.value||'';
  b.innerHTML=`<h3>Bill</h3>${cart.map((c,i)=>`<div class="cartrow"><div class="cn"><b>${esc(c.name)}</b>${c.manual?' <span class="tag">haath se</span>':''}<button class="x" onclick="cart.splice(${i},1);renderCart()">✕</button></div>
   <div class="cq">${c.mobId?'<span class="muted">1 mobile</span>':`<button onclick="cartQty(${i},-1)">−</button><b>${c.qty}</b><button onclick="cartQty(${i},1)">+</button>`}
   <span class="muted">x</span><input type="number" id="cp_${i}" value="${c.price||''}" placeholder="Qeemat" oninput="cartPrice(${i},this.value)"></div></div>`).join('')}
   <div class="row"><div><label>Discount (Rs)</label><input id="c_disc" type="number" value="${disc}" oninput="renderTotals()"></div><div><label>Customer phone (WhatsApp ke liye)</label><input id="c_ph" inputmode="tel" value="${esc(ph)}"></div></div>
   <div class="totbar"><span>Total</span><b id="c_tot"></b></div><button class="btn full big" onclick="finishSale()">✔ Sale mukammal karein</button>`;
  renderTotals();if(focusLast)setTimeout(()=>$('cp_'+(cart.length-1))?.focus(),50)}
function finishSale(){
  if(!cart.length)return alert('Bill khali hai');if(cart.some(c=>!(c.price>0)))return alert('Har cheez ki qeemat likhein');
  const disc=num('c_disc');const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const s={id:uid(),date:today(),items:cart,total:sub-disc,discount:disc,cost:cart.reduce((a,c)=>a+c.cost*c.qty,0),by:whoName(),phone:val('c_ph')};
  cart.forEach(c=>{if(c.accId){db.accessories.find(a=>a.id===c.accId).qty-=c.qty}if(c.mobId){const m=db.mobiles.find(x=>x.id===c.mobId);m.status='sold';m.soldTo='Cash sale'}});
  db.sales.push(s);cart=[];save();views.sale();saleReceipt(s.id);
}

  PK.q_c={source:custSource,onPick:r=>pkChoose('q_c',r),afterChoose:()=>$('newc').style.display='none',afterClear:()=>$('newc').style.display='block'};

function custForm(p){return`<label>Naam *</label><input id="${p}_name"><div class="row"><div><label>Phone *</label><input id="${p}_phone" inputmode="tel"></div><div><label>CNIC</label><input id="${p}_cnic" inputmode="numeric"></div></div><label>Pata</label><input id="${p}_addr">
 <h3>Guarantor (zamin)</h3><label>Naam</label><input id="${p}_gname"><div class="row"><div><label>Phone</label><input id="${p}_gphone" inputmode="tel"></div><div><label>CNIC</label><input id="${p}_gcnic" inputmode="numeric"></div></div>`}
function readCust(p){return{id:uid(),name:val(p+'_name'),phone:val(p+'_phone'),cnic:val(p+'_cnic'),address:val(p+'_addr'),gName:val(p+'_gname'),gPhone:val(p+'_gphone'),gCnic:val(p+'_gcnic'),created:today()}}
function qFill(){const m=db.mobiles.find(x=>x.id===val('q_m'));if(m){$('q_cash').value=m.price}qCalc()}
function qCalc(){const cash=num('q_cash'),pct=num('q_pct'),adv=num('q_adv'),mon=Math.max(1,num('q_mon'));if(!cash){$('q_sum').textContent='Qeemat likhein';return}
 const total=Math.round(cash*(1+pct/100));const rest=total-adv;const per=Math.ceil(rest/mon/10)*10;
 $('q_sum').innerHTML=`Qist wali kul qeemat: <b>${rs(total)}</b><br>Advance ke baad baqi: <b>${rs(rest)}</b><br>Har mahine qist: <b>${rs(per)}</b> x ${mon}`}
function saveQist(){
  let cid=val('q_c');
  if(!cid){const c=readCust('q');if(!c.name||!c.phone)return alert('Customer ka naam aur phone zaroori hai');db.customers.push(c);cid=c.id}
  const cash=num('q_cash'),pct=num('q_pct'),adv=num('q_adv'),mon=Math.max(1,num('q_mon'));
  if(!cash)return alert('Cash qeemat likhein');
  const m=db.mobiles.find(x=>x.id===val('q_m'));
  const total=Math.round(cash*(1+pct/100));if(adv>=total)return alert('Advance kul qeemat se kam hona chahiye');
  const p={id:uid(),customerId:cid,mobileId:m?.id||null,item:m?(m.model+' · IMEI '+m.imei):'Mobile',cashPrice:cash,percent:pct,total,advance:adv,months:mon,cost:m?.cost||0,date:today(),schedule:makeSchedule(total-adv,mon,val('q_start')||addMonths(today(),1)),payments:[],by:whoName()};
  if(!m&&!confirm('Stock se mobile nahi chuna. Phir bhi save karein?'))return;
  if(m){m.status='sold';m.soldTo=cust(cid).name}
  db.plans.push(p);save();toast('Save ho gaya');
  showReceipt(planReceipt(p,'Naya qist account'),cust(cid).phone);go('customers');
}

function wList(){const q=val('w_s').toLowerCase();const arr=db.plans.filter(p=>remaining(p)>0).filter(p=>{const c=cust(p.customerId);return!q||(c?.name+' '+c?.phone+' '+p.item).toLowerCase().includes(q)});
 $('w_l').innerHTML=arr.map(p=>{const c=cust(p.customerId),st=status(p);return`<div class="item"><div><b>${esc(c?.name)}</b> <span class="tag ${st.c}">${st.t}</span><br><span class="muted">${esc(p.item)} · baqi ${rs(remaining(p))}</span></div><button class="btn sm" onclick="openPay('${p.id}')">Wasool</button></div>`}).join('')||'<p class="muted">Koi active qist nahi</p>'}
function openPay(pid){
  const p=db.plans.find(x=>x.id===pid),c=cust(p.customerId),nx=nextDue(p),st=status(p);
  const sugg=st.lateAmt?st.lateAmt:(nx.amount-nx.paid);
  $('sheet').innerHTML=`<h2>${esc(c.name)} — qist wasooli</h2><p class="muted">${esc(p.item)}<br>Baqi kul: <b>${rs(remaining(p))}</b> · ${st.t}</p>

 <button class="btn full" onclick="saveMobEdit('${id}')">Save karein</button><button class="btn sec full" onclick="closeM()">Wapas</button>`;$('modal').classList.add('show')}

 if(db.mobiles.some(x=>x.id!==id&&x.imei===imei))return alert('Ye IMEI pehle se stock mein hai');if(imei.length!==15&&!confirm('IMEI 15 number ka hota hai, ye '+imei.length+' ka hai. Phir bhi save karein?'))return;
 m.model=model;m.imei=imei;m.ean=ean;m.cost=num('em_c');m.price=num('em_p');if(ean)db.models[ean]={name:model,cost:m.cost,price:m.price};save();closeM();toast('Save ho gaya');views.stock()}

function addMob(){const imei=val('m_i').replace(/\D/g,''),model=val('m_m'),ean=val('m_e');if(!model||!imei)return alert('Model aur IMEI zaroori hain');if(imei.length!==15&&!confirm('IMEI 15 number ka hota hai, ye '+imei.length+' ka hai. Phir bhi save karein?'))return;if(db.mobiles.some(m=>m.imei===imei))return alert('Ye IMEI pehle se stock mein hai');
 db.mobiles.push({id:uid(),model,imei,ean,cost:num('m_c'),price:num('m_p'),status:'stock',added:today()});if(ean)db.models[ean]={name:model,cost:num('m_c'),price:num('m_p')};
 dealerBuy(val('m_dl'),num('m_c'),val('m_pm'),model+' · '+imei);
 mf={e:ean,m:model,c:num('m_c'),p:num('m_p'),dl:val('m_dl'),pm:val('m_pm')};save();toast('Add ho gaya: '+imei);views.stock();setTimeout(()=>$('m_i')?.focus(),50)}

// Reports (owner)
views.reports=()=>{
  const ym=val('r_m')||today().slice(0,7);
  const inM=d=>d&&d.startsWith(ym);
  const sales=db.sales.filter(s=>inM(s.date));const saleTot=sales.reduce((a,s)=>a+s.total,0),saleProfit=sales.reduce((a,s)=>a+s.total-s.cost,0);
  const newPlans=db.plans.filter(p=>!p.old&&inM(p.date));const planProfit=newPlans.reduce((a,p)=>a+(p.cost?p.total-p.cost:0),0);
  let coll=0,fines=0,adv=newPlans.reduce((a,p)=>a+p.advance,0);db.plans.forEach(p=>p.payments.filter(x=>inM(x.date)).forEach(x=>{coll+=x.amount;fines+=x.fine||0}));
  const out=db.plans.reduce((a,p)=>a+remaining(p),0);const lateAmt=db.plans.reduce((a,p)=>a+(status(p).lateAmt||0),0);
  const stockVal=db.accessories.reduce((a,x)=>a+x.qty*x.cost,0)+db.mobiles.filter(m=>m.status==='stock').reduce((a,m)=>a+m.cost,0);
  $('main').innerHTML=`<div class="card"><h2>Report</h2><label>Mahina</label><input id="r_m" type="month" value="${ym}" onchange="views.reports()">
  <div class="stats" style="margin-top:10px">
   <div class="stat"><span>Cash sale</span><b>${rs(saleTot)}</b></div><div class="stat"><span>Cash sale munafa</span><b>${rs(saleProfit)}</b></div>
   <div class="stat"><span>Naye qist account</span><b>${newPlans.length}</b></div><div class="stat"><span>Qist munafa (naye accounts)</span><b>${rs(planProfit)}</b></div>
   <div class="stat"><span>Advance mila</span><b>${rs(adv)}</b></div><div class="stat"><span>Qist wasooli</span><b>${rs(coll)}</b></div>
   <div class="stat"><span>Jurmana mila</span><b>${rs(fines)}</b></div><div class="stat"><span>Kul munafa</span><b style="color:#2f6db5">${rs(saleProfit+planProfit+fines)}</b></div></div></div>
  <div class="card"><h2>Kis ne kitna liya</h2><table><tr><th></th><th>Aaj</th><th>Is mahine</th></tr>${staffTable(ym)}</table><p class="muted">Qist wasooli + jurmana + advance + cash sale</p></div>
  <div class="card"><h2>Abhi tak</h2><div class="stats"><div class="stat"><span>Bazaar mein paisa (baqi qistain)</span><b>${rs(out)}</b></div><div class="stat"><span>Is mein asal raqam</span><b>${rs(principalTotal())}</b></div><div class="stat"><span>Dealers ko dena</span><b style="color:#dc2626">${rs(dealerTotal())}</b></div><div class="stat"><span>Late raqam</span><b style="color:#dc2626">${rs(lateAmt)}</b></div><div class="stat"><span>Stock ki qeemat (khareed)</span><b>${rs(stockVal)}</b></div><div class="stat"><span>Active accounts</span><b>${db.plans.filter(p=>remaining(p)>0).length}</b></div></div></div>`;
};

function staffTable(ym){const t=today(),m={};const add=(by,d,a)=>{by=by||'—';m[by]=m[by]||{d:0,m:0};if(d===t)m[by].d+=a;if(d&&d.startsWith(ym))m[by].m+=a};
 db.plans.forEach(p=>{if(!p.old)add(p.by,p.date,p.advance);p.payments.forEach(x=>add(x.by,x.date,x.amount+(x.fine||0)))});db.sales.forEach(s=>add(s.by,s.date,s.total));
 return Object.entries(m).filter(([k,v])=>v.d||v.m).sort((a,b)=>b[1].m-a[1].m).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${rs(v.d)}</td><td>${rs(v.m)}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">Koi nahi</td></tr>'}

function oCalc(){const r=num('o_tot')-num('o_paid'),n=Math.max(1,num('o_n'));$('o_sum').innerHTML=r>0?`Baqi: <b>${rs(r)}</b> · Har qist takreeban <b>${rs(Math.ceil(r/n/10)*10)}</b>`:''}
function saveOld(){
  const tot=num('o_tot'),paid=num('o_paid'),n=Math.max(1,num('o_n'));if(!tot||paid>=tot)return alert('Kul qeemat aur ada ki gayi raqam theek likhein');
  let cid=val('o_c');if(!cid){const c=readCust('o');if(!c.name||!c.phone)return alert('Naam aur phone zaroori hai');db.customers.push(c);cid=c.id}
  db.plans.push({id:uid(),customerId:cid,mobileId:null,item:val('o_item')||'Mobile',cashPrice:0,percent:num('o_pct'),total:tot,advance:0,openingPaid:paid,months:n,cost:0,date:today(),old:true,schedule:makeSchedule(tot-paid,n,val('o_d')||today()),payments:[],by:'Malik'});
  save();toast('Purana record save ho gaya');go('customers');

// ---------- Maal, asal raqam, dealers ----------
function stockValue(){const v={accQty:0,accCost:0,accPrice:0,mobQty:0,mobCost:0,mobPrice:0};
 db.accessories.forEach(a=>{v.accQty+=a.qty;v.accCost+=a.qty*(a.cost||0);v.accPrice+=a.qty*(a.price||0)});
 db.mobiles.filter(m=>m.status==='stock').forEach(m=>{v.mobQty++;v.mobCost+=m.cost||0;v.mobPrice+=m.price||0});
 v.cost=v.accCost+v.mobCost;v.price=v.accPrice+v.mobPrice;return v}
function principalOf(p){const r=remaining(p);const pct=+p.percent||0;return pct>0?r*100/(100+pct):r}
function principalTotal(){return Math.round(db.plans.reduce((a,p)=>a+principalOf(p),0))}
function dealerBal(id){return db.dealerTx.filter(t=>t.dealerId===id).reduce((a,t)=>a+(t.type==='buy'?t.amount:-t.amount),0)}
function dealerTotal(){return db.dealers.reduce((a,d)=>a+dealerBal(d.id),0)}
function dealerFields(p,sel,pm){if(!db.dealers.length)return`<p class="muted">Dealer ka hisaab rakhna ho to pehle Aur → Dealer mein dealer add karein.</p>`;
 return`<div class="row"><div><label>Dealer (kis se liya)</label><select id="${p}_dl"><option value="">— koi nahi —</option>${db.dealers.map(d=>`<option value="${d.id}" ${d.id===sel?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div><label>Paisa</label><select id="${p}_pm"><option value="udhaar">Udhaar</option><option value="cash" ${pm==='cash'?'selected':''}>Cash diya</option></select></div></div>`}
function dealerBuy(id,amt,mode,note){if(!id||!(amt>0))return;const d=today();db.dealerTx.push({id:uid(),dealerId:id,date:d,type:'buy',amount:amt,note,by:whoName()});if(mode==='cash')db.dealerTx.push({id:uid(),dealerId:id,date:d,type:'pay',amount:amt,note:'Cash diya: '+note,by:whoName()})}
views.dealers=()=>{
  $('main').innerHTML=`<div class="card"><h2>🚚 Naya dealer</h2><div class="row"><div><label>Naam</label><input id="dl_n" placeholder="Jaise: Hafeez Centre - Ali Traders"></div><div><label>Phone</label><input id="dl_p" inputmode="tel"></div></div><button class="btn" onclick="addDealer()">Add karein</button></div>
  <div class="card"><h2>Dealers</h2>${db.dealers.map(d=>`<div class="item" onclick="dealerDetail('${d.id}')" style="cursor:pointer"><div><b>${esc(d.name)}</b><br><span class="muted">${esc(d.phone)}</span></div><b>${rs(dealerBal(d.id))}</b></div>`).join('')||'<p class="muted">Koi dealer nahi</p>'}
  ${db.dealers.length?`<h3>Kul dena hai: ${rs(dealerTotal())}</h3>`:''}</div>`;
};
function addDealer(){if(!val('dl_n'))return alert('Naam likhein');db.dealers.push({id:uid(),name:val('dl_n'),phone:val('dl_p')});save();toast('Add ho gaya');views.dealers()}
function dealerDetail(id){const d=db.dealers.find(x=>x.id===id);const tx=db.dealerTx.filter(t=>t.dealerId===id).slice().reverse();
 const buy=tx.filter(t=>t.type==='buy').reduce((a,t)=>a+t.amount,0),pay=tx.filter(t=>t.type==='pay').reduce((a,t)=>a+t.amount,0);
 $('sheet').innerHTML=`<h2>${esc(d.name)}</h2><p class="muted">${esc(d.phone)}</p><div class="stats"><div class="stat"><span>Kul maal liya</span><b>${rs(buy)}</b></div><div class="stat"><span>Paisa diya</span><b>${rs(pay)}</b></div><div class="stat"><span>Baqi dena hai</span><b style="color:#dc2626">${rs(buy-pay)}</b></div></div>
 <h3>Payment / maal add karein</h3><div class="row"><div><label>Raqam</label><input id="dt_a" type="number"></div><div><label>Note</label><input id="dt_n" placeholder="Jaise: cash, JazzCash"></div></div>
 <button class="btn" onclick="dealerTx('${id}','pay')">💵 Payment di</button><button class="btn sec" onclick="dealerTx('${id}','buy')">📦 Udhaar maal liya</button>
 <h3>Hisaab</h3>${tx.map(t=>`<div class="item"><div><b style="color:${t.type==='buy'?'#b45309':'#166534'}">${t.type==='buy'?'Maal liya':'Payment di'}</b> · ${fmtD(t.date)}<br><span class="muted">${esc(t.note)} · ${esc(t.by)}</span></div><div><b>${rs(t.amount)}</b> <button class="btn red sm" onclick="delDealerTx('${id}','${t.id}')">x</button></div></div>`).join('')||'<p class="muted">Abhi koi nahi</p>'}
 ${d.phone?`<a class="btn wa" href="tel:${esc(d.phone)}">Call</a>`:''}<button class="btn sec full" onclick="closeM();views.dealers()">Band karein</button>`;$('modal').classList.add('show')}
function dealerTx(id,type){const a=num('dt_a');if(!(a>0))return alert('Raqam likhein');db.dealerTx.push({id:uid(),dealerId:id,date:today(),type,amount:a,note:val('dt_n')||(type==='pay'?'Payment':'Udhaar maal'),by:whoName()});save();toast('Save ho gaya');dealerDetail(id)}
function delDealerTx(id,tid){if(!confirm('Ye entry delete karein?'))return;db.dealerTx=db.dealerTx.filter(t=>t.id!==tid);save();dealerDetail(id)}

views.staff=()=>{
  $('main').innerHTML=`<div class="card"><h2>🧑‍💼 Naya staff add karein</h2><label>Naam</label><input id="sf_n" placeholder="Jaise: Ahmed"><div class="row"><div><label>Phone</label><input id="sf_p" inputmode="tel"></div><div><label>PIN (login ke liye)</label><input id="sf_pin" inputmode="numeric"></div></div><button class="btn" onclick="addStaff()">Add karein</button></div>
  <div class="card"><h2>Staff list</h2>${db.staff.map(x=>`<div class="item"><div><b>${esc(x.name)}</b> <span class="tag ${x.active?'ok':'late'}">${x.active?'Chalu':'Band'}</span><br><span class="muted">${esc(x.phone)} · PIN ${esc(x.pin)}</span></div><div><button class="btn sec sm" onclick="editStaff('${x.id}')">Edit</button><button class="btn ${x.active?'red':''} sm" onclick="toggleStaff('${x.id}')">${x.active?'Login band':'Chalu karein'}</button></div></div>`).join('')||'<p class="muted">Koi staff nahi</p>'}</div>`;
};
function pinTaken(pin,exceptId){return pin===db.settings.ownerPin||db.staff.some(x=>x.pin===pin&&x.id!==exceptId)}
function addStaff(){const n=val('sf_n'),pin=val('sf_pin');if(!n||!pin)return alert('Naam aur PIN zaroori hain');if(pinTaken(pin))return alert('Ye PIN pehle se kisi ka hai, doosra rakhein');db.staff.push({id:uid(),name:n,phone:val('sf_p'),pin,active:true});save();toast('Staff add ho gaya');views.staff()}
function toggleStaff(id){const x=db.staff.find(y=>y.id===id);if(x.active&&!confirm(x.name+' ka login band karein? Purana record mehfooz rahe ga.'))return;x.active=!x.active;save();views.staff()}
function editStaff(id){const x=db.staff.find(y=>y.id===id);
 $('sheet').innerHTML=`<h2>Staff edit</h2><label>Naam</label><input id="se_n" value="${esc(x.name)}"><label>Phone</label><input id="se_p" value="${esc(x.phone)}"><label>PIN</label><input id="se_pin" value="${esc(x.pin)}" inputmode="numeric">
 <button class="btn full" onclick="saveStaff('${id}')">Save karein</button><button class="btn sec full" onclick="closeM()">Wapas</button>`;$('modal').classList.add('show')}
function saveStaff(id){const x=db.staff.find(y=>y.id===id);const n=val('se_n'),pin=val('se_pin');if(!n||!pin)return alert('Naam aur PIN zaroori hain');if(pinTaken(pin,id))return alert('Ye PIN pehle se kisi ka hai, doosra rakhein');x.name=n;x.phone=val('se_p');x.pin=pin;save();closeM();toast('Save ho gaya');views.staff()}

views.settings=()=>{
  const s=db.settings;
  $('main').innerHTML=`<div class="card"><h2>Dukaan ki maloomat</h2><label>Naam</label><input id="st_shop" value="${esc(s.shop)}"><label>Phone</label><input id="st_ph" value="${esc(s.phone)}"><label>Pata</label><input id="st_ad" value="${esc(s.address)}">
  <div class="row"><div><label>Default munafa %</label><input id="st_pct" type="number" value="${s.defaultPercent}"></div><div><label>Default late jurmana (0 = nahi)</label><input id="st_fine" type="number" value="${s.defaultFine}"></div></div>
  <div class="row"><div><label>Naya Malik PIN</label><input id="st_op" type="password" placeholder="khali = wahi"></div><div></div></div><p class="muted">Staff ka PIN: Aur → Staff</p>
  <button class="btn" onclick="saveSet()">Save</button></div>
  <div class="card"><h2>Backup</h2><p class="muted">Data abhi isi phone mein hai. Backup file WhatsApp/Drive par save kar lein.</p><button class="btn" onclick="backup()">Backup download</button><label class="btn sec">Backup wapas laayein<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label></div>
  <div class="card"><h2>Demo data</h2><p class="muted">Client ko dikhane ke liye 10 customers ka farzi record. Abhi ka data mit jaye ga.</p><button class="btn" onclick="loadDemo()">Demo data daalein</button><button class="btn red" onclick="wipeAll()">Sab data saaf karein</button></div>`;
};
function saveSet(){const s=db.settings;s.shop=val('st_shop')||s.shop;s.phone=val('st_ph');s.address=val('st_ad');s.defaultPercent=num('st_pct');s.defaultFine=num('st_fine');
 const op=val('st_op')||s.ownerPin;if(db.staff.some(x=>x.pin===op))return alert('Ye PIN kisi staff ka hai, doosra rakhein');s.ownerPin=op;save();toast('Save ho gaya');render()}
function backup(){const b=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mobile-shop-backup-'+today()+'.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings)throw 0;if(!confirm('Abhi ka data is backup se badal jaye ga. Theek?'))return;db=d;if(!db.models)db.models={};if(!db.dealers){db.dealers=[];db.dealerTx=[]}if(!db.staff){db.staff=db.settings.staffPin?[{id:uid(),name:'Staff',phone:'',pin:db.settings.staffPin,active:true}]:[];delete db.settings.staffPin}save();toast('Backup aa gaya');render()}catch(e){alert('File theek nahi')}};r.readAsText(f)}


// ---------- WhatsApp reminder ----------
function remind(pid){const p=db.plans.find(x=>x.id===pid),c=cust(p.customerId),st=status(p),nx=nextDue(p);
 const amt=st.lateAmt||(nx.amount-nx.paid);
 let t=lang==='en'?`Dear ${c.name},\n${st.c==='late'?'Your instalment of '+rs(amt)+' is overdue (due '+fmtD(p.schedule.find(s=>s.paid<s.amount).due)+').':'Your instalment of '+rs(amt)+' is due today ('+fmtD(nx.due)+').'}\nItem: ${p.item}\nTotal remaining: ${rs(remaining(p))}\nPlease pay at the shop.\n- ${db.settings.shop} ${db.settings.phone||''}`
 :`Assalam o Alaikum ${c.name},\n${st.c==='late'?'Aap ki qist '+rs(amt)+' late ho chuki hai (tareekh '+fmtD(p.schedule.find(s=>s.paid<s.amount).due)+').':'Aap ki qist '+rs(amt)+' aaj ('+fmtD(nx.due)+') due hai.'}\nCheez: ${p.item}\nKul baqi: ${rs(remaining(p))}\nMeharbani kar ke dukaan par ada kar dein.\n- ${db.settings.shop} ${db.settings.phone||''}`;

function head(){const s=db.settings;return`${s.shop}\n${s.address||''}${s.phone?'\nPh: '+s.phone:''}\n--------------------------------\n`}
function payReceipt(p,x){const c=cust(p.customerId);return head()+`QIST RECEIPT\nTareekh: ${fmtD(x.date)}\nCustomer: ${c.name}\nPhone: ${c.phone}\nCheez: ${p.item}\n--------------------------------\nQist ada: ${rs(x.amount)}${x.fine?'\nLate jurmana: '+rs(x.fine):''}\nKul ada (is dafa): ${rs(x.amount+(x.fine||0))}\n--------------------------------\nAb tak ada: ${rs(paidTotal(p))}\nBaqi: ${rs(remaining(p))}${nextDue(p)?'\nAgli qist: '+fmtD(nextDue(p).due)+' - '+rs(nextDue(p).amount-nextDue(p).paid):'\nAccount MUKAMMAL'}\n\nShukriya!`}
function planReceipt(p,title){const c=cust(p.customerId);return head()+`${title.toUpperCase()}\nTareekh: ${fmtD(today())}\nCustomer: ${c.name}\nPhone: ${c.phone}\nCheez: ${p.item}\n--------------------------------\nKul qeemat: ${rs(p.total)}\n${p.old?'Pehle ada: '+rs(p.openingPaid):'Advance: '+rs(p.advance)}\nAb tak ada: ${rs(paidTotal(p))}\nBaqi: ${rs(remaining(p))}\n--------------------------------\n${p.schedule.map(s=>`${String(s.no).padStart(2)}. ${fmtD(s.due)}  ${rs(s.amount)}  ${s.paid>=s.amount?'ADA':''}`).join('\n')}\n\nShukriya!`}
function saleReceipt(id){const s=db.sales.find(x=>x.id===id);showReceipt(head()+`CASH BILL\nTareekh: ${fmtD(s.date)}\n--------------------------------\n${s.items.map(i=>`${i.name}\n  ${i.qty} x ${rs(i.price)} = ${rs(i.qty*i.price)}`).join('\n')}\n--------------------------------${s.discount?'\nDiscount: '+rs(s.discount):''}\nKUL: ${rs(s.total)}\n\nShukriya!`,s.phone)}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='92'+p.slice(1);return p}
function showReceipt(text,phone){
  text=tr(text);$('sheet').innerHTML=`<div id="receipt">${esc(text)}</div>
  <label>WhatsApp number</label><input id="wa_n" inputmode="tel" value="${esc(phone||'')}">
  <button class="btn" onclick="window.print()">Print</button><button class="btn wa" onclick="sendWa()">WhatsApp</button><button class="btn sec" onclick="closeM()">Band karein</button>`;
  window._rt=text;$('modal').classList.add('show');
}
function sendWa(){const n=waNum(val('wa_n'));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(window._rt),'_blank')}
// ---------- Barcode scan ----------
let scanStream=null,scanLib=null;
async function scan(cb,imeiOnly){
  $('sheet').innerHTML=`<h2>Barcode scan</h2><p class="muted">Barcode ko camera ke saamne seedha rakhein</p><div id="scanbox"><video id="sv" playsinline muted></video></div><button class="btn sec full" onclick="stopScan()">Band karein</button>`;
  $('modal').classList.add('show');
  const done=v=>{if(!scanStream&&!scanLib&&!('BarcodeDetector' in window&&$('sv')))return true;v=String(v).trim();if(imeiOnly){const d=v.replace(/\D/g,'');if(d.length!==15)return false;v=d}stopScan();if(navigator.vibrate)navigator.vibrate(80);cb(v);return true};
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v=$('sv');v.srcObject=scanStream;await v.play();
      const loop=async()=>{if(!scanStream)return;try{const r=await det.detect(v);for(const b of r){if(done(b.rawValue))return}}catch(e){}requestAnimationFrame(loop)};loop();
    }else{
      $('scanbox').innerHTML='<div id="sr"></div>';
      if(!window.Html5Qrcode)await new Promise((ok,no)=>{const t=document.createElement('script');t.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)});
      scanLib=new Html5Qrcode('sr');await scanLib.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},t=>done(t));
    }
  }catch(e){$('scanbox').innerHTML='<p class="muted">Camera nahi khula. Camera ki permission dein, ya number haath se / scanner machine se likhein.</p>'}
}
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}if(scanLib){scanLib.stop().catch(()=>{});scanLib=null}closeM()}
function closeM(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'){if(scanStream||scanLib)stopScan();else closeM()}});
render();
</script>
