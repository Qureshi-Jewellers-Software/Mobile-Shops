<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile Shop & Qistain</title>
<meta name="theme-color" content="#2f6db5">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;font-size:16px}
header{background:#2f6db5;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px}
header small{opacity:.85}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px #0001}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#64748b;padding:4px 0;cursor:pointer}
nav.bottom button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:#2f6db5;font-weight:600}
nav.bottom .plus{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:#2f6db5;color:#fff;margin:-26px 6px 0;box-shadow:0 4px 12px #2f6db566;justify-content:center;padding:0}
nav.bottom .plus svg{width:30px;height:30px;stroke-width:2.4}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 12px}
.tile{border:0;border-radius:14px;background:#eaf2fc;color:#1e3a5f;padding:16px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.tile span{font-size:28px}
main{padding:12px 12px 96px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:12px 0 6px;color:#334155}
label{display:block;font-size:13px;color:#475569;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 14px;font-size:15px;background:#2f6db5;color:#fff;margin:4px 4px 0 0;cursor:pointer}
.btn.sec{background:#e2e8f0;color:#0f172a}.btn.red{background:#dc2626}.btn.wa{background:#16a34a}.btn.sm{padding:6px 10px;font-size:13px}
.full{width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f8fafc;border-radius:10px;padding:10px}
.stat span{display:block;font-size:12px;color:#64748b}.stat b{font-size:18px}
.statbtn{background:#2f6db5;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px #0001}.statbtn:active{background:#265b98}.statbtn span{color:#dbe7f7!important}.statbtn b{color:#fff!important;font-size:22px}.statbtn i{display:block;font-style:normal;font-size:12px;color:#dbe7f7;margin-top:2px}.stats .statbtn{padding:14px 12px}
.item{border-top:1px solid #e2e8f0;padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item:first-child{border-top:0}
.muted{color:#64748b;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#e2e8f0}
.tag.late{background:#fee2e2;color:#b91c1c}.tag.due{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid #e2e8f0;text-align:left}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
#receipt{font-family:monospace;font-size:14px;border:1px dashed #94a3b8;padding:12px;border-radius:8px;white-space:pre-wrap}
.login{max-width:380px;margin:60px auto}
.scanrow{display:flex;gap:6px;align-items:center}.scanrow input,.scanrow select{flex:1}.scanrow .btn{margin:0;flex:0 0 auto}
#scanbox video,#scanbox>div{width:100%;border-radius:10px;background:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:30}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;border:0;width:80mm}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
// ---------- Data ----------
const KEY='mobileShopDB_v1';
let db=load();if(db&&!db.models)db.models={};
let role=null, tab='home';try{const r=localStorage.getItem('mobileShopRole');if(r==='owner'||r==='staff')role=r}catch(e){}
function setRole(r){role=r;try{r?localStorage.setItem('mobileShopRole',r):localStorage.removeItem('mobileShopRole')}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Save nahi hua: '+e.message)}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function today(){return ymd(new Date())}
function rs(n){return 'Rs '+Math.round(+n||0).toLocaleString('en-PK')}
function fmtD(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'-'+m+'-'+y}
function addMonths(s,k){const d=pd(s);const day=d.getDate();d.setMonth(d.getMonth()+k);if(d.getDate()!==day)d.setDate(0);return ymd(d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function $(id){return document.getElementById(id)}
function val(id){return ($(id)?.value||'').trim()}
function num(id){return parseFloat(val(id))||0}
function toast(t){const e=$('toast');e.textContent=tr(t);e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const isOwner=()=>role==='owner';
function cust(id){return db.customers.find(c=>c.id===id)}

// ---------- Plan helpers ----------
function makeSchedule(amount,months,start){
  const per=Math.ceil(amount/months/10)*10; const s=[]; let left=amount;
  for(let i=0;i<months;i++){const a=i===months-1?left:Math.min(per,left);s.push({no:i+1,due:addMonths(start,i),amount:a,paid:0});left-=a}
  return s.filter(x=>x.amount>0);
}
function applyPayment(p,amt){let left=amt;for(const s of p.schedule){if(left<=0)break;const need=s.amount-s.paid;if(need>0){const t=Math.min(need,left);s.paid+=t;left-=t}}return left}
function remaining(p){return p.schedule.reduce((a,s)=>a+(s.amount-s.paid),0)}
function paidTotal(p){return p.advance+p.payments.reduce((a,x)=>a+x.amount,0)+(p.openingPaid||0)}
function status(p){
  const t=today();const rem=remaining(p);
  if(rem<=0)return{c:'ok',t:'Mukammal'};
  const late=p.schedule.filter(s=>s.paid<s.amount&&s.due<t);
  if(late.length)return{c:'late',t:late.length+' qist late',lateAmt:late.reduce((a,s)=>a+s.amount-s.paid,0),days:Math.floor((new Date(t)-new Date(late[0].due))/864e5)};
  const nx=p.schedule.find(s=>s.paid<s.amount);
  if(nx&&nx.due===t)return{c:'due',t:'Aaj due'};
  return{c:'',t:'Agli: '+fmtD(nx?.due)};
}
function nextDue(p){return p.schedule.find(s=>s.paid<s.amount)}


// ---------- Language (Roman Urdu / English) ----------
const LANG_KEY='mobileShopLang';let lang='ur';try{lang=localStorage.getItem(LANG_KEY)||'ur'}catch(e){}
const DICT=[["Abhi ka data is backup se badal jaye ga. Theek\\?", "Current data will be replaced by this backup. OK?"], ["Camera nahi khula. Camera ki permission dein, ya number haath se / scanner machine se likhein.", "Camera did not open. Allow camera permission, or type the number / use a scanner machine."], ["Data abhi isi phone mein hai. Backup file WhatsApp/Drive par save kar lein.", "Data is stored on this phone only. Save the backup file to WhatsApp/Drive."], ["Ek hi model ke kai mobile: Add ke baad sirf agla IMEI scan karte jayein.", "Many phones of the same model: after Add, just keep scanning the next IMEI."], ["Jo qist pehle se chal rahi hai, us ka baqi hisaab yahan daalein.", "Enter the remaining balance of an instalment that is already running."], ["Naya barcode — model ka naam likhein, agli dafa khud aa jaye ga", "New barcode — type the model name, it will fill itself next time"], ["Stock se mobile nahi chuna. Phir bhi save karein\\?", "No mobile selected from stock. Save anyway?"], ["Kul qeemat aur ada ki gayi raqam theek likhein", "Enter correct total price and paid amount"], ["Poora account delete\\? Wapas nahi aaye ga", "Delete the whole account? It cannot be undone"], ["Advance kul qeemat se kam hona chahiye", "Advance must be less than the total price"], ["Barcode ko camera ke saamne seedha rakhein", "Hold the barcode straight in front of the camera"], ["Naam, Malik PIN aur Staff PIN zaroori hain", "Name, Owner PIN and Staff PIN are required"], ["Customer ka naam aur phone zaroori hai", "Customer name and phone are required"], ["Malik aur Staff ka PIN alag rakhein", "Owner and Staff PIN must be different"], ["Mobile wapas stock mein daalein\\?", "Put the mobile back in stock?"], ["Pehle is ke accounts delete karein", "Delete this customer's accounts first"], ["Ye IMEI stock mein nahi mila:", "This IMEI was not found in stock:"], ["Ye IMEI pehle se stock mein hai", "This IMEI is already in stock"], ["Naam, phone ya IMEI se dhoondein", "Search by e"], ["khali = wahi", "empty = same"], ["Khareed qeemat", "Purchase price"], ["Qeemat likhein", "Enter price"], ["Raqam likhein", "Enter amount"], ["Naam likhein", "Enter name"], ["Naam aur phone zaroori hai", "Name and phone are required"], ["Mobile chunein", "Select a mobile"], ["Abhi khali hai", "Empty for now"], ["Abhi koi nahi", "None yet"], ["Wasool ho gaya", "Collected"], ["Save ho gaya", "Saved"], ["Save nahi hua:", "Not saved:"], ["Add ho gaya", "Added"], ["Backup aa gaya", "Backup restored"], ["File theek nahi", "Invalid file"], ["PIN ghalat hai", "Wrong PIN"], ["PIN likhein", "Enter PIN"], ["Shuru karein", "Start"], ["Save karein", "Save"], ["Wasool karein", "Collect"], ["Band karein", "Close"], ["Delete karein\\?", "Delete?"], ["Account delete", "Delete account"], ["Customer delete", "Delete customer"], ["Dukaan ka naam", "Shop name"], ["Pata \\(address\\)", "Address"], ["Naya Malik PIN", "New Owner PIN"], ["Naya Staff PIN", "New Staff PIN"], ["\\+ Naya customer", "+ New customer"], ["\\+ Mobile add", "+ Add mobile"], ["-- chunein --", "-- select --"], ["Late qistain", "Late instalments"], ["Late raqam", "Late amount"], ["Late customers", "Late customers"], ["Jurmana mila", "Fines received"], ["Advance mila", "Advance received"], ["Kul munafa", "Total profit"], ["Abhi tak", "Overall so far"], ["Active accounts", "Active accounts"], ["Bik chuke", "Sold"], ["Form saaf", "Clear form"], ["Qist wasooli", "Instalment collection"], ["Qist Wasooli", "Collect Instalment"], ["Qist par Mobile", "Mobile on Instalment"], ["Purana Record", "Old Record"], ["Purana record", "Old record"], ["Qist wasool", "Collect instalment"], ["Wasooliyan", "Payments"], ["Kitne mahine", "How many months"], ["Munafa %", "Profit %"], ["Har mahine qist:", "Monthly instalment:"], ["Malik login", "Owner login"], ["Staff login", "Staff login"], ["qist late", "instalment(s) late"], ["Aaj due", "Due today"], ["Agli qist:", "Next instalment:"], ["Agli:", "Next:"], ["Mukammal", "Completed"], ["Ab tak ada:", "Paid so far:"], ["Pehle ada:", "Paid earlier:"], ["Baqi kul:", "Total remaining:"], ["Late jurmana:", "Late fine:"], ["Qist ada:", "Instalment paid:"], ["QIST RECEIPT", "INSTALMENT RECEIPT"], ["NAYA QIST ACCOUNT", "NEW INSTALMENT ACCOUNT"], ["ACCOUNT STATEMENT", "ACCOUNT STATEMENT"], ["Account MUKAMMAL", "Account COMPLETED"], ["CASH BILL", "CASH BILL"], ["Shukriya!", "Thank you!"], ["Tareekh:", "Date:"], ["Cheez:", "Item:"], ["Zamin:", "Guarantor:"], ["Pata:", "Address:"], ["Munafa:", "Profit:"], ["Baqi:", "Remaining:"], ["Kul:", "Total:"], ["KUL:", "TOTAL:"], ["Ada:", "Paid:"], ["=Dhoondein", "Search"], ["=Tadaad", "Quantity"], ["=Raqam", "Amount"], ["=Tareekh", "Date"], ["=Mahina", "Month"], ["=Naam", "Name"], ["=Pata", "Address"], ["=Khali", "Empty"], ["=Saaf", "Clear"], ["=Wapas", "Back"], ["=Wasool", "Collect"], ["=Qist", "Instalment"], ["=Ada", "Paid"], ["ADA", "PAID"], ["=Koi nahi", "None"], ["Cash qeemat", "Cash price"], ["jurmana", "fine"], ["khareed", "purchase"], ["baqi", "remaining"], ["Jaise:", "e.g."], ["Phone number", "Phone number"], ["qist", "instalment"]].map(([a,b])=>a[0]==='='?[new RegExp('^(\\s*)'+a.slice(1)+'(?=\\s*$)'),b]:[new RegExp('(^|[^A-Za-z])'+a+'(?![A-Za-z])','g'),b]);
function tr(t){if(lang!=='en'||!t)return t;let r=String(t);for(const[re,b]of DICT)r=r.replace(re,(m,pre,...g)=>pre+b.replace(/\$(\d)/g,(x,i)=>g[i-1]));return r}
const trDone=new WeakMap();
function trDom(root){if(lang!=='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(trDone.get(n)===n.nodeValue)continue;if(n.parentElement&&n.parentElement.id==='receipt')continue;const t=tr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;trDone.set(n,n.nodeValue)}
 root.querySelectorAll('[placeholder]').forEach(e=>{if(e.dataset.tr)return;e.placeholder=tr(e.placeholder);e.dataset.tr=1})}
let trBusy=false;new MutationObserver(()=>{if(trBusy)return;trBusy=true;trDom($('app'));trDom($('sheet'));trBusy=false}).observe(document.body,{childList:true,subtree:true});
const _al=window.alert.bind(window),_cf=window.confirm.bind(window),_pr=window.prompt.bind(window);
window.alert=t=>_al(tr(t));window.confirm=t=>_cf(tr(t));window.prompt=(t,d)=>_pr(tr(t),d);
function setLang(l){lang=l;try{localStorage.setItem(LANG_KEY,l)}catch(e){}render()}
function langBtn(){return `<button class="btn sec sm" onclick="setLang('${lang==='en'?'ur':'en'}')">${lang==='en'?'Roman Urdu':'English'}</button>`}


// ---------- Bottom navigation ----------
const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.8 4 6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',stock:'<rect x="4" y="3" width="6" height="18" rx="2"/><rect x="14" y="8" width="6" height="13" rx="2"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
function bottomNav(){const on=k=>k.includes(tab)?'on':'';
 return`<nav class="bottom"><button class="${on(['home'])}" onclick="go('home')">${svg('home')}<span>Aaj</span></button>
 <button class="${on(['customers'])}" onclick="go('customers')">${svg('users')}<span>Grahak</span></button>
 <button class="plus" onclick="plusMenu()">${svg('plus')}</button>
 <button class="${on(['stock'])}" onclick="go('stock')">${svg('stock')}<span>Stock</span></button>
 <button class="${on(['reports','old','settings'])}" onclick="moreMenu()">${svg('more')}<span>Aur</span></button></nav>`}
function sheetGo(t){closeM();go(t)}
function plusMenu(){$('sheet').innerHTML=`<h2>Kya karna hai?</h2><div class="tiles">
 <button class="tile" onclick="sheetGo('wasooli')"><span>💰</span>Qist Wasool</button>
 <button class="tile" onclick="sheetGo('qist')"><span>📱</span>Qist par Mobile</button>
 <button class="tile" onclick="sheetGo('sale')"><span>🛒</span>Cash Sale</button></div>
 <button class="btn sec full" onclick="closeM()">Band karein</button>`;$('modal').classList.add('show')}
function moreMenu(){const o=isOwner();$('sheet').innerHTML=`<h2>Aur</h2><div class="tiles">
 ${o?`<button class="tile" onclick="sheetGo('reports')"><span>📊</span>Reports</button><button class="tile" onclick="sheetGo('old')"><span>📒</span>Purana Record</button><button class="tile" onclick="sheetGo('settings')"><span>⚙️</span>Settings</button>`:''}
 <button class="tile" onclick="closeM();setLang('${lang==='en'?'ur':'en'}')"><span>🌐</span>${lang==='en'?'Roman Urdu':'English'}</button>
 <button class="tile" onclick="closeM();logout()"><span>🚪</span>Logout</button></div>
 <button class="btn sec full" onclick="closeM()">Band karein</button>`;$('modal').classList.add('show')}

// ---------- Setup / Login ----------
function render(){
  if(!db){return renderSetup()}
  if(!role){return renderLogin()}

  $('app').innerHTML=`<header><div><b>${esc(db.settings.shop)}</b><br><small>${isOwner()?'Malik':'Staff'} login</small></div><div>${langBtn()} <button class="btn sec sm" onclick="logout()">Logout</button></div></header>
  <main id="main"></main>${bottomNav()}`;
  (views[tab]||views.home)();
}
function go(t){tab=t;render();scrollTo(0,0)}
function logout(){setRole(null);render()}
function renderSetup(){
  $('app').innerHTML=`<div class="login card"><div style="text-align:right">${langBtn()}</div><h2>Pehli dafa setup</h2>
  <label>Dukaan ka naam</label><input id="s_shop" placeholder="Jaise: Ali Mobile Zone">
  <label>Phone number</label><input id="s_phone" inputmode="tel">
  <label>Pata (address)</label><input id="s_addr">
  <label>Malik PIN (sirf aap)</label><input id="s_op" type="password" inputmode="numeric">
  <label>Staff PIN</label><input id="s_sp" type="password" inputmode="numeric">
  <button class="btn full" onclick="doSetup()">Shuru karein</button></div>`;
}
function doSetup(){
  if(!val('s_shop')||!val('s_op')||!val('s_sp'))return alert('Naam, Malik PIN aur Staff PIN zaroori hain');
  if(val('s_op')===val('s_sp'))return alert('Malik aur Staff ka PIN alag rakhein');
  db={settings:{shop:val('s_shop'),phone:val('s_phone'),address:val('s_addr'),ownerPin:val('s_op'),staffPin:val('s_sp'),defaultPercent:20,defaultFine:0},
      accessories:[],mobiles:[],models:{},customers:[],plans:[],sales:[]};
  save();setRole('owner');render();
}

  body+=h.pays.length?`<h3>Kul: ${rs(h.pays.reduce((a,o)=>a+o.x.amount+(o.x.fine||0),0))}</h3>`:''}
 if(k==='sale'){title='Aaj ki cash sale';body=h.sales.slice().reverse().map(s=>`<div class="item"><div>${s.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}<br><span class="muted">${esc(s.by)}${s.discount?' · discount '+rs(s.discount):''}</span></div><div><b>${rs(s.total)}</b><br><button class="btn sec sm" onclick="saleReceipt('${s.id}')">Receipt</button></div></div>`).join('');

function addCart(){const a=db.accessories.find(x=>x.id===val('c_acc'));if(!a)return alert('Accessory chunein');const q=Math.max(1,num('c_qty'));const inCart=cart.filter(c=>c.accId===a.id).reduce((s,c)=>s+c.qty,0);if(q+inCart>a.qty)return alert('Stock mein sirf '+a.qty+' hain');cart.push({accId:a.id,name:a.name,qty:q,price:num('c_pr')||a.price,cost:a.cost||0});views.sale()}
function addCartMob(){const m=db.mobiles.find(x=>x.id===val('c_mob'));if(!m)return alert('Mobile chunein');if(cart.some(c=>c.mobId===m.id))return;cart.push({mobId:m.id,name:m.model+' ('+m.imei+')',qty:1,price:m.price,cost:m.cost||0});views.sale()}
function finishSale(){
  if(!cart.length)return alert('Bill khali hai');
  const disc=num('c_disc');const sub=cart.reduce((a,c)=>a+c.price*c.qty,0);
  const s={id:uid(),date:today(),items:cart,total:sub-disc,discount:disc,cost:cart.reduce((a,c)=>a+c.cost*c.qty,0),by:isOwner()?'Malik':'Staff',phone:val('c_ph')};
  cart.forEach(c=>{if(c.accId){db.accessories.find(a=>a.id===c.accId).qty-=c.qty}if(c.mobId){const m=db.mobiles.find(x=>x.id===c.mobId);m.status='sold';m.soldTo='Cash sale'}});
  db.sales.push(s);cart=[];save();views.sale();saleReceipt(s.id);
}

function custForm(p){return`<label>Naam *</label><input id="${p}_name"><div class="row"><div><label>Phone *</label><input id="${p}_phone" inputmode="tel"></div><div><label>CNIC</label><input id="${p}_cnic" inputmode="numeric"></div></div><label>Pata</label><input id="${p}_addr">
 <h3>Guarantor (zamin)</h3><label>Naam</label><input id="${p}_gname"><div class="row"><div><label>Phone</label><input id="${p}_gphone" inputmode="tel"></div><div><label>CNIC</label><input id="${p}_gcnic" inputmode="numeric"></div></div>`}
function readCust(p){return{id:uid(),name:val(p+'_name'),phone:val(p+'_phone'),cnic:val(p+'_cnic'),address:val(p+'_addr'),gName:val(p+'_gname'),gPhone:val(p+'_gphone'),gCnic:val(p+'_gcnic'),created:today()}}
function qFill(){const m=db.mobiles.find(x=>x.id===val('q_m'));if(m){$('q_cash').value=m.price}qCalc()}
function qCalc(){const cash=num('q_cash'),pct=num('q_pct'),adv=num('q_adv'),mon=Math.max(1,num('q_mon'));if(!cash){$('q_sum').textContent='Qeemat likhein';return}
 const total=Math.round(cash*(1+pct/100));const rest=total-adv;const per=Math.ceil(rest/mon/10)*10;
 $('q_sum').innerHTML=`Qist wali kul qeemat: <b>${rs(total)}</b><br>Advance ke baad baqi: <b>${rs(rest)}</b><br>Har mahine qist: <b>${rs(per)}</b> x ${mon}`}
function saveQist(){
  let cid=val('q_c');
  if(!cid){const c=readCust('q');if(!c.name||!c.phone)return alert('Customer ka naam aur phone zaroori hai');db.customers.push(c);cid=c.id}
  const cash=num('q_cash'),pct=num('q_pct'),adv=num('q_adv'),mon=Math.max(1,num('q_mon'));
  if(!cash)return alert('Cash qeemat likhein');
  const m=db.mobiles.find(x=>x.id===val('q_m'));
  const total=Math.round(cash*(1+pct/100));if(adv>=total)return alert('Advance kul qeemat se kam hona chahiye');
  const p={id:uid(),customerId:cid,mobileId:m?.id||null,item:m?(m.model+' · IMEI '+m.imei):'Mobile',cashPrice:cash,percent:pct,total,advance:adv,months:mon,cost:m?.cost||0,date:today(),schedule:makeSchedule(total-adv,mon,val('q_start')||addMonths(today(),1)),payments:[],by:isOwner()?'Malik':'Staff'};
  if(!m&&!confirm('Stock se mobile nahi chuna. Phir bhi save karein?'))return;
  if(m){m.status='sold';m.soldTo=cust(cid).name}
  db.plans.push(p);save();toast('Save ho gaya');

}

function openPay(pid){
  const p=db.plans.find(x=>x.id===pid),c=cust(p.customerId),nx=nextDue(p),st=status(p);
  const sugg=st.lateAmt?st.lateAmt:(nx.amount-nx.paid);
  $('sheet').innerHTML=`<h2>${esc(c.name)} — qist wasooli</h2><p class="muted">${esc(p.item)}<br>Baqi kul: <b>${rs(remaining(p))}</b> · ${st.t}</p>

function doPay(pid){
  const p=db.plans.find(x=>x.id===pid);const amt=num('p_amt'),fine=num('p_fine');
  if(amt<=0&&fine<=0)return alert('Raqam likhein');if(amt>remaining(p))return alert('Raqam baqi se zyada hai ('+rs(remaining(p))+')');
  applyPayment(p,amt);const pay={id:uid(),date:today(),amount:amt,fine,note:val('p_note'),by:isOwner()?'Malik':'Staff'};p.payments.push(pay);save();
  closeM();toast('Wasool ho gaya');showReceipt(payReceipt(p,pay),cust(p.customerId).phone);render();
}

function custDetail(cid){
  const c=cust(cid);const ps=db.plans.filter(p=>p.customerId===cid);
  $('sheet').innerHTML=`<h2>${esc(c.name)}</h2><p class="muted">Phone: ${esc(c.phone)}<br>CNIC: ${esc(c.cnic)}<br>Pata: ${esc(c.address)}<br>Zamin: ${esc(c.gName)} ${esc(c.gPhone)} ${esc(c.gCnic)}</p>
  ${ps.map(p=>{const st=status(p);return`<div class="card" style="border:1px solid #e2e8f0"><b>${esc(p.item)}</b> <span class="tag ${st.c}">${st.t}</span>${p.old?' <span class="tag">Purana record</span>':''}

   <h3>Wasooliyan</h3>${p.payments.map(x=>`<div class="item"><span>${fmtD(x.date)} · ${rs(x.amount)}${x.fine?' + jurmana '+rs(x.fine):''} <span class="muted">${esc(x.by)}</span></span><span><button class="btn sec sm" onclick="showReceipt(payReceipt(db.plans.find(q=>q.id==='${p.id}'),db.plans.find(q=>q.id==='${p.id}').payments.find(y=>y.id==='${x.id}')),'${esc(c.phone)}')">Receipt</button>${isOwner()?`<button class="btn red sm" onclick="delPay('${p.id}','${x.id}')">x</button>`:''}</span></div>`).join('')||'<p class="muted">Abhi koi nahi</p>'}

  $('modal').classList.add('show');
}
function rebuild(p){p.schedule.forEach(s=>s.paid=0);applyPayment(p,p.payments.reduce((a,x)=>a+x.amount,0)+(p.openingInSchedule||0))}
function delPay(pid,xid){if(!confirm('Ye wasooli delete karein?'))return;const p=db.plans.find(x=>x.id===pid);p.payments=p.payments.filter(x=>x.id!==xid);rebuild(p);save();custDetail(p.customerId)}

// ---------- Receipts ----------
function head(){const s=db.settings;return`${s.shop}\n${s.address||''}${s.phone?'\nPh: '+s.phone:''}\n--------------------------------\n`}
function payReceipt(p,x){const c=cust(p.customerId);return head()+`QIST RECEIPT\nTareekh: ${fmtD(x.date)}\nCustomer: ${c.name}\nPhone: ${c.phone}\nCheez: ${p.item}\n--------------------------------\nQist ada: ${rs(x.amount)}${x.fine?'\nLate jurmana: '+rs(x.fine):''}\nKul ada (is dafa): ${rs(x.amount+(x.fine||0))}\n--------------------------------\nAb tak ada: ${rs(paidTotal(p))}\nBaqi: ${rs(remaining(p))}${nextDue(p)?'\nAgli qist: '+fmtD(nextDue(p).due)+' - '+rs(nextDue(p).amount-nextDue(p).paid):'\nAccount MUKAMMAL'}\n\nShukriya!`}
function planReceipt(p,title){const c=cust(p.customerId);return head()+`${title.toUpperCase()}\nTareekh: ${fmtD(today())}\nCustomer: ${c.name}\nPhone: ${c.phone}\nCheez: ${p.item}\n--------------------------------\nKul qeemat: ${rs(p.total)}\n${p.old?'Pehle ada: '+rs(p.openingPaid):'Advance: '+rs(p.advance)}\nAb tak ada: ${rs(paidTotal(p))}\nBaqi: ${rs(remaining(p))}\n--------------------------------\n${p.schedule.map(s=>`${String(s.no).padStart(2)}. ${fmtD(s.due)}  ${rs(s.amount)}  ${s.paid>=s.amount?'ADA':''}`).join('\n')}\n\nShukriya!`}
function saleReceipt(id){const s=db.sales.find(x=>x.id===id);showReceipt(head()+`CASH BILL\nTareekh: ${fmtD(s.date)}\n--------------------------------\n${s.items.map(i=>`${i.name}\n  ${i.qty} x ${rs(i.price)} = ${rs(i.qty*i.price)}`).join('\n')}\n--------------------------------${s.discount?'\nDiscount: '+rs(s.discount):''}\nKUL: ${rs(s.total)}\n\nShukriya!`,s.phone)}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='92'+p.slice(1);return p}
function showReceipt(text,phone){
  text=tr(text);$('sheet').innerHTML=`<div id="receipt">${esc(text)}</div>
  <label>WhatsApp number</label><input id="wa_n" inputmode="tel" value="${esc(phone||'')}">
  <button class="btn" onclick="window.print()">Print</button><button class="btn wa" onclick="sendWa()">WhatsApp</button><button class="btn sec" onclick="closeM()">Band karein</button>`;
  window._rt=text;$('modal').classList.add('show');
}
function sendWa(){const n=waNum(val('wa_n'));window.open('https://wa.me/'+n+'?text='+encodeURIComponent(window._rt),'_blank')}
// ---------- Barcode scan ----------
let scanStream=null,scanLib=null;
async function scan(cb,imeiOnly){
  $('sheet').innerHTML=`<h2>Barcode scan</h2><p class="muted">Barcode ko camera ke saamne seedha rakhein</p><div id="scanbox"><video id="sv" playsinline muted></video></div><button class="btn sec full" onclick="stopScan()">Band karein</button>`;
  $('modal').classList.add('show');
  const done=v=>{if(!scanStream&&!scanLib&&!('BarcodeDetector' in window&&$('sv')))return true;v=String(v).trim();if(imeiOnly){const d=v.replace(/\D/g,'');if(d.length!==15)return false;v=d}stopScan();if(navigator.vibrate)navigator.vibrate(80);cb(v);return true};
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v=$('sv');v.srcObject=scanStream;await v.play();
      const loop=async()=>{if(!scanStream)return;try{const r=await det.detect(v);for(const b of r){if(done(b.rawValue))return}}catch(e){}requestAnimationFrame(loop)};loop();
    }else{
      $('scanbox').innerHTML='<div id="sr"></div>';
      if(!window.Html5Qrcode)await new Promise((ok,no)=>{const t=document.createElement('script');t.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';t.onload=ok;t.onerror=no;document.head.appendChild(t)});
      scanLib=new Html5Qrcode('sr');await scanLib.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:120}},t=>done(t));
    }
  }catch(e){$('scanbox').innerHTML='<p class="muted">Camera nahi khula. Camera ki permission dein, ya number haath se / scanner machine se likhein.</p>'}
}
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}if(scanLib){scanLib.stop().catch(()=>{});scanLib=null}closeM()}
function closeM(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'){if(scanStream||scanLib)stopScan();else closeM()}});
render();
</script>
